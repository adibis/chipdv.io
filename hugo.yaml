baseURL: https://chipdv.io/
locale: en-us
title: chipDV
theme: hextra

enableRobotsTXT: true
enableGitInfo: true

params:
  description: "UVM chip design verification, worked through in full: register verification, memory allocation, SoC reuse patterns, and firmware verification."
  images:
    - "images/og-card.png"

  author:
    name: Aditya Shevade

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  imageZoom:
    enable: true

  reportIssue:
    enable: true
    repo: "https://github.com/adibis/chipdv.io"

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"


menu:
  main:
    - name: CSR Verification
      pageRef: /csr
      weight: 1
      params:
        tab: true
    - name: Memory Allocation
      pageRef: /mam
      weight: 2
      params:
        tab: true
    - name: SoC Reuse
      pageRef: /reuse
      weight: 3
      params:
        tab: true
    - name: Firmware
      pageRef: /fw
      weight: 4
      params:
        tab: true
    - name: Projects
      pageRef: /projects
      weight: 5
    - name: About
      pageRef: /about
      weight: 7
    - name: search
      weight: 8
      params:
        type: search
    - name: theme-toggle
      weight: 9
      params:
        type: theme-toggle
    - name: RSS
      url: /index.xml
      weight: 10
      params:
        icon: rss

markup:
  highlight:
    noClasses: false
    style: monokai
    lineNos: true
    lineNumbersInTable: false
  goldmark:
    renderer:
      unsafe: true
