baseURL: https://chipdv.io/
locale: en-us
title: chipDV
theme: hextra

enableRobotsTXT: true
enableGitInfo: true

params:
  description: "AI-native chip design verification and the classical UVM engineering underneath it: register verification, memory allocation, testbench architecture, firmware verification, and knowledge graphs for chip design."
  images:
    - "images/og-card.png"

  author:
    name: Aditya Shevade

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"


menu:
  main:
    - name: DV Intelligence
      pageRef: /ai-dv
      weight: 1
    - name: CSR Verification
      pageRef: /csr
      weight: 2
    - name: Memory Allocation
      pageRef: /mam
      weight: 3
    - name: SoC Reuse
      pageRef: /reuse
      weight: 4
    - name: Firmware
      pageRef: /fw
      weight: 5
    - name: Projects
      pageRef: /projects
      weight: 6
    - name: About
      pageRef: /about
      weight: 7
    - name: search
      weight: 8
      params:
        type: search
    - name: theme-toggle
      weight: 9
      params:
        type: theme-toggle
    - name: RSS
      url: /index.xml
      weight: 10
      params:
        icon: rss

markup:
  highlight:
    noClasses: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true
